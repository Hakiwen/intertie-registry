name: pages
# Manual until launch: a Pages site is PUBLIC even from a private repo, so publishing is
# Ben's call. To launch: enable Pages (Source: GitHub Actions), then add `push: branches: [main]`.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - name: Assemble site
        run: |
          mkdir -p _site/reports _site/schema
          cp index.html implementations.json CNAME _site/
          cp reports/*.json _site/reports/ 2>/dev/null || true
          cp schema/*.json _site/schema/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
